[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant"
dynamic = ["version"]
description = "Windows desktop alert overlay, file search and MCP server"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "pywin32==312",
]

[tool.setuptools.dynamic]
version = { attr = "assistant.__version__" }

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.setuptools.package-data]
assistant = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
