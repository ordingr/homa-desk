[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homa-desk"
dynamic = ["version"]
description = "Windows desktop alert overlay, file search and MCP server"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "pywin32==312",
    "starlette==1.10.0",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[tool.setuptools.dynamic]
version = { attr = "homa.__version__" }

[tool.setuptools.packages.find]
include = ["homa*"]

[tool.setuptools.package-data]
homa = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60
